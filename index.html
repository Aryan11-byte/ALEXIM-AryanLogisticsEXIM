<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALEXIM | Aryan Logistics Export Import</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    width: 100%;
    overflow: hidden;
    font-family: 'Montserrat', sans-serif;
    background: #06111e;
    color: white;
}

/* CINEMATIC BACKGROUND */

.background {
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(3,10,20,0.92),
            rgba(3,10,20,0.55),
            rgba(3,10,20,0.75)
        ),
        url("https://images.unsplash.com/photo-1494412519320-aa613dfb7738?q=85&w=2400");

    background-size: cover;
    background-position: center;
    transform: scale(1.08);
    animation: cinematicZoom 20s ease-in-out infinite alternate;
    z-index: -2;
}

@keyframes cinematicZoom {
    from {
        transform: scale(1.05);
    }

    to {
        transform: scale(1.18);
    }
}

/* DARK OVERLAY */

.overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(
        180deg,
        rgba(2,8,17,.35),
        rgba(2,8,17,.35),
        rgba(2,8,17,.85)
    );
    z-index: -1;
}

/* GOLD LIGHT EFFECT */

.gold-light {
    position: absolute;
    width: 450px;
    height: 450px;
    background: rgba(201,164,92,.10);
    filter: blur(130px);
    border-radius: 50%;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);
}

/* MAIN CONTENT */

.main {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    animation: fadeIn 2s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* TOP LABEL */

.top-label {
    font-size: 10px;
    letter-spacing: 7px;
    color: #d4b576;
    margin-bottom: 35px;
    text-transform: uppercase;
}

/* BRAND NAME */

.brand {
    font-family: 'Cinzel', serif;
    font-size: clamp(65px, 12vw, 145px);
    font-weight: 500;
    letter-spacing: 18px;
    color: #e5c78a;

    text-shadow:
        0 0 20px rgba(201,164,92,.2),
        0 0 60px rgba(201,164,92,.15);
}

/* GOLD LINE */

.line {
    width: 100px;
    height: 1px;
    background: #c9a45c;
    margin: 30px auto;
    box-shadow: 0 0 15px #c9a45c;
}

/* COMPANY NAME */

.company-name {
    font-family: 'Cinzel', serif;
    font-size: clamp(13px, 2vw, 21px);
    letter-spacing: 5px;
    color: #f3eee4;
    font-weight: 400;
}

/* TAGLINE */

.tagline {
    margin-top: 25px;
    font-size: 10px;
    letter-spacing: 5px;
    color: #c5c0b5;
    text-transform: uppercase;
}

/* BUTTON */

.enter-btn {
    margin-top: 65px;
    padding: 19px 48px;

    border: 1px solid #c9a45c;
    background: rgba(201,164,92,.08);

    color: #e5c78a;
    text-decoration: none;

    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;

    transition: all .5s ease;
    position: relative;
    overflow: hidden;
}

.enter-btn:hover {
    background: #c9a45c;
    color: #06111e;
    box-shadow: 0 0 35px rgba(201,164,92,.35);
    transform: translateY(-4px);
}

/* FOOTER */

.footer {
    position: absolute;
    bottom: 30px;
    width: 100%;
    text-align: center;
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.55);
}

/* MOBILE */

@media(max-width: 600px) {

    .brand {
        letter-spacing: 9px;
    }

    .company-name {
        letter-spacing: 2px;
        line-height: 2;
    }

    .top-label {
        letter-spacing: 4px;
    }

    .tagline {
        letter-spacing: 2px;
    }

    .enter-btn {
        padding: 17px 35px;
    }
}

</style>
</head>

<body>

<div class="background"></div>
<div class="overlay"></div>
<div class="gold-light"></div>

<main class="main">

    <div class="top-label">
        A New Vision of Global Trade
    </div>

    <h1 class="brand">
        ALEXIM
    </h1>

    <div class="line"></div>

    <h2 class="company-name">
        ARYAN LOGISTICS EXPORT IMPORT
    </h2>

    <p class="tagline">
        Two Generations. One Vision
    </p>

    <a href="about.html" class="enter-btn">
        CLICK HERE &nbsp; →
    </a>

</main>

<div class="footer">
    ESTABLISHED ON EXPERIENCE · BUILT FOR THE FUTURE
</div>

</body>
</html>
