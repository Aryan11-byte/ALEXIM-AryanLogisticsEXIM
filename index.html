<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALEXIM — Coming Soon</title>

<meta name="description" content="A new chapter in international trade. ALEXIM — Aryan Logistics Export Import.">

<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold: #c8ad79;
    --gold-light: #e5d3aa;
    --background: #080d14;
    --white: #f4f1e9;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: var(--background);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    z-index: -3;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(41, 55, 70, 0.32),
            transparent 65%
        ),
        linear-gradient(
            135deg,
            #080d14,
            #101a25,
            #080d14
        );
}

/* GOLDEN LIGHT */

.glow {
    position: fixed;
    width: 500px;
    height: 500px;

    left: 50%;
    top: 48%;

    transform: translate(-50%, -50%);

    background: radial-gradient(
        circle,
        rgba(200, 173, 121, 0.09),
        transparent 70%
    );

    filter: blur(30px);
    animation: breathe 7s ease-in-out infinite alternate;

    pointer-events: none;
}

@keyframes breathe {
    from {
        opacity: 0.4;
        transform: translate(-50%, -50%) scale(0.8);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2);
    }
}

/* FRAME */

.frame {
    position: fixed;
    inset: 22px;
    border: 1px solid rgba(200, 173, 121, 0.18);
    pointer-events: none;
}

/* TOP LABEL */

.top-label {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);

    font-size: 9px;
    font-weight: 400;
    letter-spacing: 5px;
    color: var(--gold);

    white-space: nowrap;

    animation: fadeDown 1.5s ease forwards;
}

/* MAIN CONTENT */

.container {
    position: relative;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 30px;
}

/* LOGO */

.logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(75px, 13vw, 145px);
    font-weight: 500;

    letter-spacing: 13px;
    color: var(--gold-light);

    line-height: 1;

    text-shadow:
        0 0 35px rgba(200, 173, 121, 0.12);

    animation: fadeUp 1.8s ease forwards;
}

/* LOGO LINE */

.logo-line {
    width: 65px;
    height: 1px;

    margin: 35px auto 27px;

    background: linear-gradient(
        to right,
        transparent,
        var(--gold),
        transparent
    );

    animation: expand 2s ease forwards;
}

/* COMPANY NAME */

.company {
    font-size: 10px;
    font-weight: 400;

    letter-spacing: 5px;
    line-height: 2;

    color: rgba(244, 241, 233, 0.72);

    animation: fadeUp 2.1s ease forwards;
}

/* COMING SOON */

.coming-soon {
    margin-top: 75px;

    font-size: 10px;
    font-weight: 400;

    letter-spacing: 7px;
    color: var(--gold);

    animation: fadeUp 2.5s ease forwards;
}

.coming-soon::before,
.coming-soon::after {
    content: "";
    display: inline-block;

    width: 24px;
    height: 1px;

    background: rgba(200, 173, 121, 0.5);

    vertical-align: middle;
    margin: 0 17px;
}

/* DESCRIPTION */

.description {
    margin-top: 19px;

    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;

    font-weight: 400;
    letter-spacing: 1px;

    color: rgba(244, 241, 233, 0.65);

    animation: fadeUp 2.8s ease forwards;
}

/* FOOTER */

.footer {
    position: absolute;
    bottom: 48px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 8px;
    letter-spacing: 3px;

    color: rgba(244, 241, 233, 0.38);

    animation: fadeUp 3s ease forwards;
}

/* ANIMATIONS */

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeDown {
    from {
        opacity: 0;
        transform: translate(-50%, -15px);
    }

    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }
}

@keyframes expand {
    from {
        width: 0;
        opacity: 0;
    }

    to {
        width: 65px;
        opacity: 1;
    }
}

/* MOBILE */

@media (max-width: 600px) {

    .frame {
        inset: 12px;
    }

    .top-label {
        top: 42px;
        font-size: 8px;
        letter-spacing: 3px;
    }

    .logo {
        letter-spacing: 7px;
    }

    .company {
        font-size: 8px;
        letter-spacing: 3px;
    }

    .coming-soon {
        margin-top: 65px;
        font-size: 9px;
        letter-spacing: 4px;
    }

    .coming-soon::before,
    .coming-soon::after {
        width: 12px;
        margin: 0 8px;
    }

    .description {
        font-size: 18px;
    }

    .footer {
        bottom: 35px;
        font-size: 7px;
        letter-spacing: 2px;
    }

}

</style>
</head>

<body>

<div class="background"></div>
<div class="glow"></div>
<div class="frame"></div>

<div class="top-label">
    AN INTERNATIONAL TRADE VENTURE
</div>

<main class="container">

    <div class="logo">
        ALEXIM
    </div>

    <div class="logo-line"></div>

    <div class="company">
        ARYAN LOGISTICS EXPORT IMPORT
    </div>

    <div class="coming-soon">
        COMING SOON
    </div>

    <div class="description">
        A new chapter in global trade begins.
    </div>

</main>

<footer class="footer">
    GLOBAL TRADE &nbsp; · &nbsp; GLOBAL CONNECTIONS
</footer>

</body>
</html>
